{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Task — Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="dot"></span>
      Task Manager
    </div>
    <div class="navbar-actions">
      <a href="{% url 'task_list' %}" class="btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Cancel
      </a>
    </div>
  </nav>

  <div class="wrapper" style="max-width: 560px;">

    <!-- PAGE HEADER -->
    <div class="page-header">
      <div>
        <h1>New Task</h1>
        <p>Fill in the details below to add a task</p>
      </div>
    </div>

    <div class="card">
      <form method="post">
        {% csrf_token %}

        <div class="form-group">
          <label class="form-label" for="title">Title</label>
          <input
            type="text"
            id="title"
            name="title"
            class="form-control"
            placeholder="What needs to be done?"
            required
            autofocus
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Description</label>
          <textarea
            id="description"
            name="description"
            class="form-control"
            placeholder="Add more details, context, or notes…"
            required
          ></textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 1.5rem;">
          <a href="{% url 'task_list' %}" class="btn">Cancel</a>
          <button type="submit" class="btn btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Create Task
          </button>
        </div>

      </form>
    </div>

  </div>
</body>
</html>
